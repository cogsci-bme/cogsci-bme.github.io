    <!-- A charset és a viewport a _layouts/default.html <head> részében van
         megadva, ezért itt nem ismételjük meg. A viewport szándékosan nem
         korlátozza a nagyítást (nincs maximum-scale), hogy az oldal
         gyengénlátók számára is nagyítható maradjon. -->
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>

    {% if page.excerpt %}
    <meta name="description" content="{{ page.excerpt| strip_html }}" />
    <meta property="og:description" content="{{ page.excerpt| strip_html }}" />
    {% else %}
    <meta name="description" content="{{ site.description }}">
    <meta property="og:description" content="{{ site.description }}" />
    {% endif %}
    <meta name="author" content="{{ site.name }}" />

    {% if page.title %}
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="twitter:title" content="{{ page.title }}" />
    {% endif %}
